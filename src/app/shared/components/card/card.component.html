<!-- Product Card -->
<div
  class="card group relative overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md transition"
>
  <div
    [routerLink]="['/details', product().slug, product()._id]"
    class="cursor-pointer block focus:outline-none"
    tabindex="0"
  >
    <!-- Image -->
    <div class="card-img bg-gray-50">
      <div class="w-full h-40 sm:h-44 md:h-48 lg:h-52 xl:h-56 p-3">
        <img
          [src]="product().imageCover"
          class="w-full h-full object-contain"
          [alt]="product().title"
          loading="lazy"
        />
      </div>
    </div>

    <!-- Body -->
    <div class="card-body p-3 sm:p-4">
      <h3 class="text-xs sm:text-sm font-medium text-gray-900">
        {{ product().category.name }}
      </h3>

      <p class="mt-1 line-clamp-2 text-sm sm:text-base font-light text-gray-700 leading-5">
        {{ product().title }}
      </p>

      <div class="flex justify-between items-center mt-3">
        <p class="text-sm sm:text-base font-semibold">
          {{ product().price | currency : 'GBP' }}
        </p>

        <div class="flex items-center gap-1 text-sm">
          <i class="fas fa-star text-yellow-300"></i>
          <span class="text-gray-800">{{ product().ratingsAverage }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- CTA -->
  <div class="p-3 sm:p-4 pt-0">
    <button
      (click)="addToCart(product()._id)"
      title="Add To Cart"
      role="button"
      class="btn w-full inline-flex items-center justify-center gap-2"
    >
      <i class="fa-solid fa-cart-shopping"></i>
      <span>Add To Cart</span>
    </button>
  </div>

  <!-- Action Layer (Hover on desktop + Focus on keyboard + Touch-friendly) -->
  <div
    class="layer absolute top-3 right-3 flex flex-col gap-2
           translate-x-12 opacity-0 pointer-events-none
           transition-all duration-300 ease-in-out
           group-hover:translate-x-0 group-hover:opacity-100 group-hover:pointer-events-auto
           group-focus-within:translate-x-0 group-focus-within:opacity-100 group-focus-within:pointer-events-auto"
  >
    <button
      role="button"
      title="Add To Wishlist"
      class="btn h-10 w-10 p-0 inline-flex items-center justify-center rounded-full"
    >
      <i class="fa-regular fa-heart"></i>
    </button>

    <button
      title="Quick View"
      role="button"
      class="btn h-10 w-10 p-0 inline-flex items-center justify-center rounded-full"
    >
      <i class="fa-regular fa-eye"></i>
    </button>
  </div>
</div>

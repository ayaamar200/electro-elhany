<section>
  <div class="container max-w-7xl">
    <div class="main-title text-center">
      <h2 class="text-2xl text-gray-900 font-bold">Wiring Devices Products</h2>
    </div>
    <input
      [(ngModel)]="searchTerm"
      type="search"
      class="main-input my-5 bg-gray-100"
      name="search"
      id="search "
      placeholder=" Search..... "
    />

    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 mt-5">
      @for (product of productList()| paginate: { id: 'foo', itemsPerPage: pageSize(), currentPage:
      p(), totalItems: total() } | search: searchTerm; track product._id) {
      <app-card [product]="product" />
      }
    </div>
    <!-- <div class="flex justify-center mt-4">
      <pagination-controls class="my-pagination" id="foo" (pageChange)="getAllProductsDataOnCategory($event)">
      </pagination-controls>
    </div> -->
  </div>
</section>

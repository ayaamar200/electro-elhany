<section class="product py-20 my-6">
  <div class="container max-w-7xl">
    <div class="main-title text-center">
      <h2 class="text-2xl text-gray-900 font-bold">All Products</h2>
      <p class="text-red-400">Check out our most popular products handpicked just for you</p>
    </div>

    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 mt-5">
      @for (product of productList(); track product._id) {
      <app-card [product]="product" />
      }
    </div>
  </div>
</section>

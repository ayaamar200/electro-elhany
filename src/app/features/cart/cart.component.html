<section class="p-4 my-5">
  <!-- Cart Data -->

  <div class="container grid sm:grid-cols-12 gap-4">
    <div class="col-span-8 bg-white p-4 rounded-md shadow">
      <div class="flex items-center justify-between p-4">
        <div class="flex items-center space-x-3">
          <h1 class="text-3xl font-medium">Cart</h1>
          <span class="text-red-500 font-semibold text-sm">
            {{ cartDetails.cartItems.length }} items</span
          >
        </div>

        <button class="btn">clear cart</button>
      </div>

      @for (item of cartDetails.cartItems; track item.product._id) {
      <div class="bg-gray-100 rounded-md shadow my-2 grid sm:grid-cols-12 relative">
        <div class="col-span-2">
          <img [src]="item.product.imageCover" class="w-full" [alt]="item.product.title" />
        </div>

        <div class="col-span-10 flex justify-between items-center p-4">
          <div>
            <h3 class="md:text-xl font-medium mb-2">{{ item.product.title }}</h3>

            <div
              class="bg-gray-200 border border-gray-500 rounded-md flex items-center space-x-10 py-1 px-2"
            >
              <button class="cursor-pointer text-sm"><i class="fas fa-minus"></i></button>
              <span class="font-medium"> {{ item.quantity }} </span>
              <button class="cursor-pointer text-sm"><i class="fas fa-plus"></i></button>
            </div>
          </div>
          <span class="font-semibold text-lg p-2">{{ item.price }} EGP</span>
        </div>
        <button
          role="button"
          title="Remove"
          class="absolute top-2 end-2 hover:text-red-500 transition-colors duration-300 cursor-pointer"
        >
          <i class="fa-regular fa-trash-can text-sm font-medium"></i>
        </button>
      </div>
      }

      <!-- <div class="bg-white shadow h-[100px] flex justify-center items-center">
        <h2 class="font-medium">your cart is empty</h2>
      </div> -->
    </div>

    <!-- Payment -->

    <div class="col-span-4 bg-white p-4 rounded-md shadow">
      <div class="border-b-2 border-red-500">
        <h2 class="md:text-2xl font-medium">Order Summary</h2>

        <div class="flex justify-between items-center my-4">
          <h3>Total Price</h3>
          <h4>{{ cartDetails.totalCartPrice }} EGP</h4>
        </div>
      </div>

      <button class="btn rounded-md my-5 w-full">checkout</button>
    </div>
  </div>
</section>

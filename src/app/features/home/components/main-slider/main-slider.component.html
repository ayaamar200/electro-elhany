<main class="main-slider">
  <div class="grid grid-cols-1 md:grid-cols-[60%_minmax(0,1fr)] capitalize text-gray-100 gap-4">
    <!-- ****************** Main Slider ****************** -->
    <swiper-container
      class="mySwiper"
      loop="true"
      autoplay="true"
      pagination="true"
      pagination-clickable="true"
      navigation="true"
      free-mode="true"
    >
      <swiper-slide>
        <div
          class="slider img-1 font-medium md:text-xl text-sm flex flex-col justify-center items-center"
        >
          <h2 class="font-bold md:text-3xl text-xl">Indoor Lights</h2>
          <p class="py-1 mb-4 text-gray-400">
            discover stylish lamps for every corner of your home
          </p>

          <button class="btn mt-6">
            <a routerLink="#">shop now</a>
          </button>
        </div>
      </swiper-slide>

      <swiper-slide>
        <div
          class="slider img-2 font-medium md:text-xl text-sm flex flex-col justify-center items-center"
        >
          <h2 class="font-bold md:text-3xl text-xl">Outdoor Lights</h2>
          <p class="py-1 mb-4 text-gray-400">
            explore our range of outdoor lighting solutions for your home
          </p>

          <button class="btn mt-6">
            <a routerLink="#">shop now</a>
          </button>
        </div>
      </swiper-slide>

      <swiper-slide>
        <div
          class="slider img-3 font-medium md:text-xl text-sm flex flex-col justify-center items-center"
        >
          <h2 class="font-bold md:text-3xl text-xl">Decorative Lights</h2>
          <p class="py-1 mb-4 text-gray-400">
            enhance your decor with our decorative lighting collection
          </p>

          <button class="btn mt-6">
            <a routerLink="#">shop now</a>
          </button>
        </div>
      </swiper-slide>
    </swiper-container>

    <!-- ****************** Side Banners ****************** -->
    <div class="grid grid-cols-1 gap-4">
      <div
        class="side-banner text-center item-1 flex items-center justify-center rounded-md hover:scale-101 transition-all duration-300"
      >
        <div>
          <h2 class="font-bold md:text-3xl text-xl">spots and panels</h2>
          <button class="btn mt-6">
            <a routerLink="#">shop now</a>
          </button>
        </div>
      </div>

      <div
        class="side-banner item-2 text-center flex items-center justify-center rounded-md hover:scale-101 transition-all duration-300"
      >
        <div>
          <a href="#">
            <h2 class="font-bold md:text-3xl text-xl">LED strip</h2>
            <button class="btn mt-6">
              <a routerLink="#">shop now</a>
            </button>
          </a>
        </div>
      </div>
    </div>
  </div>
</main>

<section class="product py-20 my-6">
  <div class="container max-w-7xl">
    <div class="main-title mb-6 text-center">
      <h2 class="text-xl md:text-2xl text-gray-900 font-medium">Our Popular Products</h2>
      <p class="text-red-400">Check out our most popular products handpicked just for you</p>
    </div>

    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
      @for (product of productList(); track product._id) {
      <div class="card hover:scale-103 transition-all duration-300">
        <div class="card-img">
          <div>
            <img [src]="product.imageCover" class="w-full object-contain" [alt]="product.title" />
          </div>

          <div class="layer flex justify-center items-center py-2 space-x-2">
            <button
              role="button"
              title="Add To Wishlist"
              class="text-gray-400 px-2 py-1 bg-white border rounded-md hover:bg-red-500 hover:text-white"
            >
              <i class="fa-regular fa-heart"></i>
            </button>

            <button
              title="Quick View"
              role="button"
              class="text-gray-400 px-2 py-1 bg-white border rounded-md hover:bg-red-500 hover:text-white"
            >
              <i class="fa-regular fa-eye"></i>
            </button>

            <button
              title="Add To Cart"
              role="button"
              class="text-gray-400 px-2 py-1 bg-white border rounded-md hover:bg-red-500 hover:text-white"
            >
              <i class="fa-solid fa-cart-shopping"></i>
            </button>
          </div>
        </div>
        <div class="card-body p-4 border-t border-gray-100">
          <h2 class="font-medium">
            {{ product.title }}
          </h2>
          <div class="flex justify-between items-center py-2">
            <span class="font-medium"> {{ product.price }} EGP </span>
            <div class="flex items-center justify-center">
              <span class="flex items-center justify-center">
                <i class="fas fa-star text-yellow-300"></i>
              </span>

              <span>
                {{ product.ratingsAverage }}
              </span>
            </div>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</section>

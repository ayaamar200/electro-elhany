
<section class="product py-10 sm:py-14 lg:py-20 my-6">
  <div class="container mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="main-title text-center">
      <h2 class="text-xl sm:text-2xl lg:text-3xl text-gray-900 font-bold">
        Popular Products
      </h2>
      <p class="text-sm sm:text-base text-red-400 mt-2">
        Check out our most popular products handpicked just for you
      </p>
    </div>

    <!-- Responsive Grid -->
    <div
      class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4 lg:gap-5 mt-6 sm:mt-8"
    >
      @for (product of productList().slice(0, 10); track product._id) {
        <app-card class="w-full" [product]="product" />
      }
    </div>

    <!-- CTA -->
    <div class="mt-8 sm:mt-10 flex justify-center">
      <button class="btn w-full sm:w-auto min-w-[220px]" routerLink="/all-products">
        See More...
      </button>
    </div>
  </div>
</section>

<section class="category py-20 my-6 bg-gray-100">
  <div class="container text-center max-w-7xl">
    <div class="main-title mb-6">
      <h2 class="text-xl md:text-2xl text-gray-900 font-medium">Product Categories</h2>
      <p class="text-red-400">Discover a wide range of Categories</p>
    </div>

    <div class="categories grid md:grid-cols-5 md:gap-6 grid-cols-2 gap-4">
      @for (cat of categoriesList(); track cat._id) {
      <app-card [category]="cat" />
      }
    </div>

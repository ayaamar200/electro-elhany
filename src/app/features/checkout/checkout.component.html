<section class="my-5">
  <div class="container mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
    <div class="main-title text-center capitalize py-4">
      <h1 class="text-xl sm:text-2xl lg:text-3xl font-semibold">Checkout</h1>
      <p class="text-sm sm:text-base text-red-400 mt-1">Complete your purchase</p>
    </div>

    <div class="grid grid-cols-1">
      <div class="mt-5 border border-gray-200 p-4 sm:p-6 lg:p-8 shadow-md rounded-md bg-white">
        <form [formGroup]="checkoutForm" class="main-form">
          <!-- Contact -->
          <div>
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
              <h2 class="text-red-500 py-1 font-medium">Contact Information</h2>
              <p class="py-1 text-sm sm:text-base">
                Already have an account?
                <a routerLink="/login" class="text-red-600 underline cursor-pointer">Login</a>
              </p>
            </div>

            <app-input
              [element]="'input'"
              [control]="checkoutForm.get('contactEmail')"
              [inputId]="'email'"
              [inputType]="'email'"
              [placeholder]="'Enter your email'"
              [label]="''"
            >
              Email must end with a valid domain (e.g., .com, .net, .org)
            </app-input>
          </div>

          <!-- Shipping -->
          <div class="mt-4">
            <h2 class="text-red-500 py-2 font-medium">Shipping Address</h2>

            <app-input
              [element]="'input'"
              [control]="checkoutForm.get('shippingAddress.fullName')"
              [inputId]="'fullName'"
              [inputType]="'text'"
              [placeholder]="'Enter your Full Name'"
              [label]="'Full Name'"
            ></app-input>

            <app-input
              [element]="'textarea'"
              [control]="checkoutForm.get('shippingAddress.streetAddress')"
              [inputId]="'address'"
              [placeholder]="'Enter your Address Details...'"
              [label]="'Delivery Address'"
            ></app-input>

            <app-input
              [element]="'input'"
              [control]="checkoutForm.get('shippingAddress.phone')"
              [inputId]="'phone'"
              [inputType]="'tel'"
              [placeholder]="'Enter your Phone Number'"
              [label]="'Phone Number'"
            >
              Invalid phone number format. Accepts local or international (e.g., +201001234567 or
              01012345678)
            </app-input>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <app-input
                [element]="'input'"
                [control]="checkoutForm.get('shippingAddress.country')"
                [inputId]="'country'"
                [inputType]="'text'"
                [placeholder]="'Country...'"
                [label]="'Country'"
              ></app-input>

              <app-input
                [element]="'input'"
                [control]="checkoutForm.get('shippingAddress.city')"
                [inputId]="'city'"
                [inputType]="'text'"
                [placeholder]="'City...'"
                [label]="'City'"
              ></app-input>
            </div>

            <!-- 3 fields become grid instead of flex (better on mobile) -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-1">
              <app-input
                [element]="'input'"
                [control]="checkoutForm.get('shippingAddress.governorate')"
                [inputId]="'governorate'"
                [inputType]="'text'"
                [placeholder]="'Governorate...'"
                [label]="'Governorate'"
              ></app-input>

              <app-input
                [element]="'input'"
                [control]="checkoutForm.get('shippingAddress.building')"
                [inputId]="'building'"
                [inputType]="'text'"
                [placeholder]="'Optional'"
                [label]="'Building Info'"
              ></app-input>

              <app-input
                [element]="'input'"
                [control]="checkoutForm.get('shippingAddress.postalCode')"
                [inputId]="'postalCode'"
                [inputType]="'text'"
                [placeholder]="'Optional'"
                [label]="'Postal Code'"
              ></app-input>
            </div>

            <app-input
              [element]="'textarea'"
              [control]="checkoutForm.get('shippingAddress.notes')"
              [inputId]="'notes'"
              [placeholder]="'Enter any Additional Notes (Optional)'"
              [label]="'Notes'"
            ></app-input>
          </div>

          <!-- Payment (COD only) -->
          <div class="mt-4">
            <h2 class="text-red-500 py-1 font-medium">Payment Method</h2>

            <div class="space-y-3 mt-2">
              <label
                class="flex items-center p-4 border border-gray-400 rounded-md cursor-pointer hover:bg-gray-50"
                [class.border-red-500]="checkoutForm.get('paymentMethod')?.value === 'cod'"
              >
                <input type="radio" class="mr-3" formControlName="paymentMethod" value="cod" />
                <div class="flex flex-col">
                  <span class="font-medium text-gray-700">Cash on Delivery</span>
                  <span class="text-xs text-gray-500">Pay when your order arrives</span>
                </div>
              </label>
            </div>

            <div class="flex justify-end mt-4">
              <button type="submit" class="btn w-full sm:w-auto uppercase" (click)="submit()">
                place order
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
